name: Validate source and native fixtures
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Install isolated native dependencies
        run: python -m pip install -r requirements.txt
      - name: Domain tests
        run: npm test
      - name: Type check and production build
        run: npm run build
      - name: Native fixture and HTTP security tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Audit shipped frontend dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check desktop shell JavaScript syntax
        run: node --check electron/main.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ matrix.os }}
          path: dist
          retention-days: 14
# This matrix validates source, not signed installers or the AoE2 game runtime.
# Desktop release requires separately bundled Python runtime, platform smoke tests,
# signing/notarization and the manual acceptance checklist in docs/RELEASE-CHECKLIST.md.
